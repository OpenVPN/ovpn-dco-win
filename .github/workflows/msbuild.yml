name: MSBuild

on: [push, pull_request]

env:
  SOLUTION_FILE_PATH: .

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        arch: [x64, ARM64]
        build_conf: [Debug, Release, Debug-Win11, Release-Win11]
        include:
          - arch: x64
            triplet: x64-windows
          - arch: ARM64
            triplet: arm64-windows

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Restore artifacts, or run vcpkg, build and cache artifacts
      uses: lukka/run-vcpkg@v7.4
      with:
        vcpkgGitCommitId: 'd015e31e90838a4c9dfa3eed45979bc70d9357fc'
        vcpkgArguments: 'asio'
        vcpkgTriplet: '${{ matrix.triplet }}'

    - name: Install Wix 3.14
      run: |
        Invoke-WebRequest -Uri "https://build.openvpn.net/downloads/temp/wix314-toolset.zip" -OutFile wix.zip
        Expand-Archive -Path .\wix.zip -DestinationPath wix
        Move-Item '.\wix\WiX Toolset v3.14\bin' .\wix

    - name: vcpkg integrate install
      shell: cmd
      run: |
        cd vcpkg && vcpkg.exe integrate install

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{ matrix.build_conf }} /p:Platform="${{ matrix.arch }}" ${{env.SOLUTION_FILE_PATH}}

    - name: Build GUI
      working-directory: gui
      shell: cmd
      run: |
        mkdir build&& cd build&& cmake ..&& cmake --build . --config Release
        cp ..\data64.key Release

    - name: Build MSM
      working-directory: msm
      if: ${{ matrix.build_conf == 'Release' }}
      run: |
        New-Item -Path dist\${{ matrix.arch }}\win10 -type directory -Force
        New-Item -Path dist\${{ matrix.arch }}\win11 -type directory -Force
        Copy-Item -Path ..\${{ matrix.arch }}\${{ matrix.build_conf }}\ovpn-dco\* -Destination dist\${{ matrix.arch }}\win10\ -Recurse
        Copy-Item -Path ..\${{ matrix.arch }}\${{ matrix.build_conf }}\ovpn-dco\* -Destination dist\${{ matrix.arch }}\win11\ -Recurse 
        .\build.ps1 -Arch ${{ matrix.arch }} -Wix ..\wix

    - uses: actions/upload-artifact@v4
      with:
        name: ovpn-dco_${{ matrix.arch }}_${{ matrix.build_conf }}
        path: |
          ${{ matrix.arch }}\${{matrix.build_conf}}\ovpn-dco\ovpn-dco.*
          msm\${{ matrix.arch }}\${{matrix.build_conf}}\installer.dll
          msm\*.msi
          msm\*.msm
          gui\build\Release\*.*

  tests:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Configure CMake tests
      run: cmake -S tests -B tests/build -A x64

    - name: Build CMake tests
      run: cmake --build tests/build --config Release

    - name: Run CMake tests
      run: ctest --test-dir tests/build --build-config Release --output-on-failure

  analyze:
    name: CodeQL (Windows driver)
    runs-on: windows-2022
    permissions:
      # required to upload results to GitHub code scanning
      security-events: write
      # required to fetch the microsoft/windows-drivers CodeQL pack from GHCR
      packages: read
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    # windows-drivers depends on microsoft/cpp-queries, which the CodeQL Action
    # does not fetch transitively. Pre-download both into the shared package
    # cache so the driver suite resolves without listing (and running) cpp-queries
    # as its own pack.
    - name: Pre-fetch driver query pack and its dependency
      shell: pwsh
      run: |
        $ver = "2.26.4"
        $zip = "$env:RUNNER_TEMP\codeql.zip"
        Invoke-WebRequest -Uri "https://github.com/github/codeql-cli-binaries/releases/download/v$ver/codeql-win64.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\codeql-cli" -Force
        & "$env:RUNNER_TEMP\codeql-cli\codeql\codeql.exe" pack download microsoft/windows-drivers@1.10.0 microsoft/cpp-queries@0.0.5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: c-cpp
        # we build the driver ourselves below (autobuild can't drive the WDK project)
        build-mode: manual
        config-file: ./.github/codeql/codeql-config.yml

    # only the driver project is needed; it has no vcpkg/asio dependency.
    # /t:Rebuild guarantees a clean compile so CodeQL traces every file.
    - name: Build driver (traced by CodeQL)
      run: msbuild /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 ovpn-dco-win.vcxproj

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:c-cpp"
